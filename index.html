<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash-Éclair plane finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b111e; --sky:#16223d; --line:#253557; --sign:#ffd23f; --cloud:#e8eef7; --slate:#8fa1c2; --cyan:#38bdf8;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, var(--sky), var(--ink) 70%) fixed;
  color:var(--cloud); font-family:Barlow,system-ui,sans-serif; padding:20px;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  border-bottom:1px solid rgba(255,255,205,0.06);
  padding-bottom:14px;
}
.brand{display:flex;flex-direction:column;gap:2px}
.brand-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:28px;
  letter-spacing:.06em;
  color:var(--cloud);
  line-height:1;
}
.brand-title .highlight{color:var(--sign)}
.brand-title .live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--sign);
  box-shadow:0 0 10px var(--sign);
  animation:blink 1.8s ease-in-out infinite alternate;
}
@keyframes blink{
  0%{ opacity:0.35; transform:scale(0.85); }
  100%{ opacity:1; transform:scale(1.15); }
}
.brand-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--slate);
  letter-spacing:.12em;
  text-transform:uppercase;
}

#status{font-size:12px;color:var(--slate);font-family:'JetBrains Mono',monospace}
.btn-group{display:flex;gap:8px;align-items:center}
button{
  font:inherit;
  color:var(--cloud);
  background:transparent;
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .3s ease;
}
button:hover{border-color:var(--slate);background:rgba(255,255,255,0.04)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sign);outline-offset:2px}

main{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:stretch;transition:opacity 0.6s ease, transform 0.6s ease}
@media (max-width:820px){
  header{flex-direction:column;align-items:flex-start;gap:12px}
  main{grid-template-columns:1fr}
}

.fade-out{
  opacity:0;
  transform:scale(0.97);
  transition:opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
.fade-in{
  animation:arriveAvion 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes arriveAvion{
  0%{ opacity:0; transform:translateY(22px) scale(0.96); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}

.left{display:flex;flex-direction:column;gap:16px}

.detection-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(90deg, rgba(56,189,248,0.12), rgba(27,39,71,0.4));
  border:1px solid rgba(56,189,248,0.28);
  border-radius:10px;
  padding:10px 14px;
}
.detection-banner .left-info{
  display:flex;
  align-items:center;
  gap:10px;
}
.detection-banner .beacon{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
  animation:beaconPulse 1.8s ease-in-out infinite alternate;
}
@keyframes beaconPulse{
  0%{ opacity:0.4; transform:scale(0.85); }
  100%{ opacity:1; transform:scale(1.2); }
}
.detection-banner .text{
  font-size:14px;
  font-weight:500;
  color:var(--cloud);
  letter-spacing:.02em;
}
.detection-banner .distance-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px;
  font-weight:700;
  color:var(--sign);
  letter-spacing:.04em;
}

.plane-canvas{
  aspect-ratio:16/10;
  border-radius:14px;
  background:linear-gradient(145deg, #131c31, #0a0f1c);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 35px rgba(0,0,0,0.65);
}

.wind-stream{
  position:absolute;
  width:1.5px;
  background:linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.45), transparent);
  border-radius:2px;
  animation:windFlow linear infinite;
  pointer-events:none;
}
@keyframes windFlow{
  0%{ transform:translateY(-120px); opacity:0; }
  30%{ opacity:0.8; }
  80%{ opacity:0.8; }
  100%{ transform:translateY(280px); opacity:0; }
}

.plane-canvas::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, transparent 0%, rgba(56,189,248,0.06) 50%, transparent 100%);
  animation:hudScan 4s linear infinite;
  pointer-events:none;
}
@keyframes hudScan{
  0%{ transform:translateY(-100%); }
  100%{ transform:translateY(100%); }
}

.plane-canvas svg.blueprint{
  width:85%; height:85%;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,0.6));
  animation:flightVibe 4.5s ease-in-out infinite alternate;
  z-index:1;
}
@keyframes flightVibe{
  0%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-4px) rotate(0.4deg); }
  100%{ transform:translateY(3px) rotate(-0.3deg); }
}

.plane-hud-badge{
  position:absolute; top:12px; left:14px;
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color:var(--sign); background:rgba(11,17,30,0.85);
  padding:3px 8px; border-radius:4px;
  border:1px solid rgba(255,210,63,0.3); letter-spacing:.08em;
  z-index:2;
}
.plane-hud-type{
  position:absolute; bottom:12px; right:14px;
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);
  z-index:2;
}

/* Titre modèle en grand jaune */
.model-hero{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:clamp(38px,6vw,62px);
  line-height:0.98;
  color:var(--sign);
  letter-spacing:.02em;
  text-transform:uppercase;
}

/* Ligne immatriculation & vol */
.immat-sub{
  font-size:18px;
  font-weight:500;
  color:var(--cloud);
  margin-top:4px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}
.immat-sub .reg{
  font-family:'JetBrains Mono',monospace;
  font-size:16px;
  color:var(--cyan);
  background:rgba(56,189,248,0.1);
  border:1px solid rgba(56,189,248,0.25);
  padding:2px 7px;
  border-radius:4px;
}
.immat-sub .flight{color:var(--slate)}
.immat-sub small{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--slate);
  background:rgba(255,255,255,0.06);
  padding:2px 6px;
  border-radius:4px;
}

.route-box{
  background:rgba(22,34,61,0.45);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.route-main{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:24px;
  color:var(--cloud);
  display:flex;
  align-items:center;
  gap:10px;
}
.route-arrow{
  color:var(--sign);
  font-size:20px;
  animation:arrowSlide 2s ease-in-out infinite alternate;
}
@keyframes arrowSlide{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(4px); }
}
.route-sub{font-size:13px;color:var(--slate);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.right{display:flex;flex-direction:column;gap:16px}

.radar-box{
  aspect-ratio:1;
  max-width:320px;
  width:100%;
  margin:0 auto;
  position:relative;
  border-radius:50%;
  background:radial-gradient(circle, #13223f 0%, #0a1120 75%);
  border:1px solid var(--line);
  box-shadow:0 0 28px rgba(0,0,0,0.5);
  overflow:hidden;
}
.radar-box svg{width:100%;height:100%}

.radar-sweep{
  transform-origin:150px 150px;
  animation:radarSweepAnim 4.5s linear infinite;
}
@keyframes radarSweepAnim{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}

.pulse-circle{
  transform-origin:150px 150px;
  animation:radarPulse 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
}
@keyframes radarPulse{
  0%{ r:4; opacity:0.9; stroke-width:2; }
  100%{ r:120; opacity:0; stroke-width:0.5; }
}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);margin-top:auto}
.stat{
  padding:12px 4px;
  border-bottom:1px solid var(--line);
  opacity:0;
  animation:statReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.stat:nth-child(1){ animation-delay:0.15s; }
.stat:nth-child(2){ animation-delay:0.3s; }
.stat:nth-child(3){ animation-delay:0.45s; }
.stat:nth-child(4){ animation-delay:0.6s; }

@keyframes statReveal{
  0%{ opacity:0; transform:translateY(12px); }
  100%{ opacity:1; transform:translateY(0); }
}

.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.stat:nth-child(even){padding-left:16px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:36px;line-height:1}
.stat .v i{font-style:normal;font-size:16px;font-weight:500;color:var(--slate);margin-left:4px}
.stat .l{font-size:13px;color:var(--slate);margin-top:4px}

.empty{text-align:center;padding:60px 10px;color:var(--slate);font-size:19px;line-height:1.6;animation:arriveAvion 1s ease forwards}
.settings{border:1px solid var(--line);border-radius:12px;padding:16px;display:none;gap:12px;flex-wrap:wrap;align-items:end;background:#0d1424aa}
.settings.open{display:flex}
.settings label{display:flex;flex-direction:column;font-size:13px;color:var(--slate);gap:4px}
.settings input{font:inherit;color:var(--cloud);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;width:170px}
.settings .hint{flex-basis:100%;font-size:13px;color:var(--slate)}
.settings .go{background:var(--sign);color:var(--ink);border-color:var(--sign);font-weight:600}
.btn-geo{background:rgba(56,189,248,0.1);border-color:var(--cyan);color:var(--cyan);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-title">
        <span class="live-dot"></span>
        FLASH-ÉCLAIR <span class="highlight">PLANE FINDER</span>
      </div>
      <div class="brand-sub">SURVEILLANCE RADAR DE PROXIMITÉ</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span id="status">Démarrage…</span>
      <div class="btn-group">
        <button id="btn-gps" class="btn-geo" type="button" title="Me géolocaliser">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
          GPS
        </button>
        <button id="cfg" type="button">Coordonnées</button>
      </div>
    </div>
  </header>

  <section class="settings" id="settings">
    <label>Latitude<input id="lat" inputmode="decimal" placeholder="ex. 44.1132"></label>
    <label>Longitude<input id="lon" inputmode="decimal" placeholder="ex. 4.9084"></label>
    <button class="go" id="save" type="button">Enregistrer</button>
    <button class="btn-geo" id="btn-gps-settings" type="button">Obtenir ma position GPS</button>
    <p class="hint">Astuce : le bouton GPS remplit automatiquement tes coordonnées précises via le navigateur.</p>
  </section>

  <div id="content"></div>
</div>

  trajectoireHistory = JSON.parse(localStorage.getItem("traj_cache") || "{}");

const airportAsyncCache = {};
async function resoudreAeroportEnLigne(code){
  if(!code || code.length !== 3 || airportAsyncCache[code]) return;
  airportAsyncCache[code] = true;
  try{
    const r = await fetch(`https://raw.githubusercontent.com/mwgg/Airports/master/airports.json`);
    if(r.ok){
      const data = await r.json();
      for(const icao in data){
        const apt = data[icao];
        if(apt.iata && apt.iata.toUpperCase() === code){
          AIRPORTS[code] = { 
            ville: apt.city || apt.name, 
            nom: apt.name, 
            lat: parseFloat(apt.lat), 
            lon: parseFloat(apt.lon) 
          };
          const el = document.getElementById("apt-" + code);
          if(el) el.textContent = `${AIRPORTS[code].ville} (${AIRPORTS[code].nom})`;
          break;
        }
      }
    }
  }catch(e){}
}

function formatAirport(code){
  if(!code || code === "—") return { code: "—", label: "Non renseigné", lat: null, lon: null };
  const c = code.toUpperCase().trim();
  const a = AIRPORTS[c];
  if(a) return { code: c, label: `${a.ville} (${a.nom})`, lat: a.lat, lon: a.lon };
  resoudreAeroportEnLigne(c);
  return { code: c, label: `Recherche de l'aéroport…`, lat: null, lon: null };
}

/* ===== Calcul de l'heure d'arrivée estimée (ETA) ===== */
function estimerHeureArrivee(ac){
  const dest = formatAirport(ac.dest);
  if(!dest || !dest.lat || !dest.lon) return null;
  const vitKmh = (typeof ac.gs === "number" && ac.gs > 40) ? ac.gs * 1.852 : null;
  if(!vitKmh) return null;

  const distRestanteKm = distanceKm(ac.lat, ac.lon, dest.lat, dest.lon);
  const tempsHeures = distRestanteKm / vitKmh;
  const maintenant = new Date();
  const dateArrivee = new Date(maintenant.getTime() + tempsHeures * 3600 * 1000);

  const h = String(dateArrivee.getHours()).padStart(2, "0");
  const m = String(dateArrivee.getMinutes()).padStart(2, "0");
  return `${h}h${m}`;
}

/* ===== Position & Géolocalisation Automatique ===== */
function lirePos(){
  try{
    const p = JSON.parse(localStorage.getItem("pos")||"null");
    if(p && isFinite(p.lat) && isFinite(p.lon)) return p;
  }catch(e){}
  return window.__pos || null;
}
function ecrirePos(p){
  window.__pos = p;
  currentPos = p;
  try{ localStorage.setItem("pos", JSON.stringify(p)); }catch(e){}
}

function declencherGeolocalisation(){
  if(!navigator.geolocation){
    statusEl.textContent = "GPS non pris en charge";
    return;
  }
  statusEl.textContent = "Localisation GPS…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      const p = {
        lat: parseFloat(pos.coords.latitude.toFixed(5)),
        lon: parseFloat(pos.coords.longitude.toFixed(5))
      };
      ecrirePos(p);
      $("lat").value = p.lat;
      $("lon").value = p.lon;
      $("settings").classList.remove("open");
      statusEl.textContent = "Position GPS trouvée";
      tick();
    },
    err => {
      statusEl.textContent = "Accès GPS refusé";
      const p = lirePos();
      if(!p) $("settings").classList.add("open");
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

$("save").onclick = () => {

  if(!isFinite(lat) || !isFinite(lon) || Math.abs(lat)>90 || Math.abs(lon)>180){

  }
  ecrirePos({lat,lon});

  tick();
};

/* ===== Utilitaires Géographiques ===== */
const arrondi = n => Math.round(n).toLocaleString("fr-FR");
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371, r=Math.PI/180;
  const a=Math.sin((lat2-lat1)*r/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin((lon2-lon1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function gisement(lat1,lon1,lat2,lon2){
  const r = Math.PI/180;
  const y = Math.sin((lon2-lon1)*r) * Math.cos(lat2*r);
  const x = Math.cos(lat1*r)*Math.sin(lat2*r) - Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos((lon2-lon1)*r);
  return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
}

function projeterSurRadar(posUser, latAvion, lonAvion, maxKm){
  const dist = distanceKm(posUser.lat, posUser.lon, latAvion, lonAvion);
  const azimut = gisement(posUser.lat, posUser.lon, latAvion, lonAvion);
  const rPixelMax = 120;
  const distRatio = Math.min(dist / maxKm, 1.25);
  const rPixel = distRatio * rPixelMax;
  const angleRad = (azimut - 90) * (Math.PI / 180);
  return {
    x: 150 + rPixel * Math.cos(angleRad),
    y: 150 + rPixel * Math.sin(angleRad),
    dist
  };
}

function calculerEchelleRadar(dist){
  if(dist <= 15) return 18;
  if(dist <= 30) return 36;
  if(dist <= 55) return 60;
  return 90;
}

/* ===== Appel JSONP FR24 ===== */
function jsonpFR24(url, ms = 7000){
  return new Promise((resolve, reject) => {
    const cbName = "fr24_cb_" + Math.random().toString(36).substring(2, 9);
    const script = document.createElement("script");
    let timer = null;
    window[cbName] = (data) => { cleanup(); resolve(data); };
    function cleanup(){
      if(timer) clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    timer = setTimeout(() => { cleanup(); reject(new Error("Délai dépassé")); }, ms);
    script.onerror = () => { cleanup(); reject(new Error("Erreur de chargement")); };
    const sep = url.includes("?") ? "&" : "?";
    script.src = `${url}${sep}callback=${cbName}`;
    document.head.appendChild(script);
  });
}

async function chercherAvions(pos){
  const deg = RAYON_SCAN_KM / 111.32;
  const lamin = (pos.lat - deg).toFixed(4);
  const lamax = (pos.lat + deg).toFixed(4);
  const lomin = (pos.lon - deg).toFixed(4);
  const lomax = (pos.lon + deg).toFixed(4);

  const url = `https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${lamax},${lamin},${lomin},${lomax}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=0&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`;

  const j = await jsonpFR24(url);
  const liste = [];
  for(const k of Object.keys(j)){
    if(["full_count", "version", "stats"].includes(k)) continue;
    const d = j[k];
    if(Array.isArray(d) && typeof d[1] === "number" && typeof d[2] === "number"){
      const origin = (d[11] || "").trim().toUpperCase();
      const dest = (d[12] || "").trim().toUpperCase();
      const flight = (d[16] || d[13] || "").trim();
      const typeAppareil = (d[8] || "").toUpperCase().trim();
      const alt = d[4];

      const isHelico = /^(EC|H1|H2|R22|R44|R66|AS3|A109|A139|B06|B407|B429|S76|UH60)/.test(typeAppareil);
      const hasPlanComplet = origin.length === 3 && dest.length === 3;
      const enVol = alt !== "ground" && alt > 100;

      if(hasPlanComplet && flight.length >= 2 && enVol && !isHelico){
        liste.push({
          hex: d[0],
          lat: d[1],
          lon: d[2],
          track: d[3],
          alt_baro: d[4],
          gs: d[5],
          t: typeAppareil,
          r: d[9],
          origin: origin,
          dest: dest,
          flight: flight
        });
      }
    }
  }
  return liste;
}

function detecterProfil(t){
  if(!t) return { type: "TWIN_JET", label: "Avion Commercial Réacteur" };
  const u = t.toUpperCase().trim();

  if(/^(DR4|C15|C17|C18|P28|PA2|PA3|SR2|DA4|DA6|TB1|TB2|AP2)/.test(u)){
    return { type: "LIGHT_PROP", label: "Avion de Tourisme Monomoteur" };
  }
  if(/^(AT4|AT7|DH8|B35|BE2|PC1|TBM|C20)/.test(u)){
    return { type: "TURBOPROP", label: "Turbopropulseur Commercial" };
  }
  if(/^(FA7|FA8|F90|F2T|C5|C6|C7|CL3|CL6|GL5|GLE|GL7|GLF|E55|E50|E35|LJ)/.test(u)){
    return { type: "BIZJET", label: "Jet d'Affaires Privé" };
  }
  if(/^(A38|A34|B74|C17|AN1)/.test(u)){
    return { type: "HEAVY_QUAD", label: "Très Gros Porteur Quadrimoteur" };
  }
  if(/^(A35|B77|B78|A33|B76)/.test(u)){
    return { type: "WIDEBODY_TWIN", label: "Long-Courrier Gros Porteur" };
  }
  return { type: "TWIN_JET", label: "Moyen-Courrier Commercial" };
}

  </main>`;
}

/* ===== Boucle d'animation à 60 FPS ===== */
function animer(){
  requestAnimationFrame(animer);
  if(!currentPlane || !currentPos) return;

  const layer = document.getElementById("radar-dynamic-layer");
  if(!layer) return;

  const now = performance.now();
  const dt = (now - currentPlane.lastUpdate) / 1000;

  const track = typeof currentPlane.track === "number" ? currentPlane.track : 0;
  const gsKmh = (typeof currentPlane.gs === "number" ? currentPlane.gs : 0) * 1.852;
  const distKmTraveled = (gsKmh / 3600) * dt;

  const trackRad = track * (Math.PI / 180);
  const dLat = (distKmTraveled * Math.cos(trackRad)) / 110.574;
  const dLon = (distKmTraveled * Math.sin(trackRad)) / (111.320 * Math.cos(currentPlane.baseLat * Math.PI / 180));

  const liveLat = currentPlane.baseLat + dLat;
  const liveLon = currentPlane.baseLon + dLon;

  const ptActuel = projeterSurRadar(currentPos, liveLat, liveLon, currentRadarMaxKm);

  const distEl = document.getElementById("live-distance");
  if(distEl){
    distEl.innerHTML = `${ptActuel.dist.toFixed(1).replace(".",",")}<i>km</i>`;
  }

  const bannerDistEl = document.getElementById("banner-distance");
  if(bannerDistEl){
    bannerDistEl.textContent = `${ptActuel.dist.toFixed(1).replace(".",",")} km`;
  }

  const hex = currentPlane.hex;
  const hist = trajectoireHistory[hex] || [];
  let pointsTrajet = hist.map(pt => projeterSurRadar(currentPos, pt.lat, pt.lon, currentRadarMaxKm));

  const retroPoints = [];
  const distanceArriereMaxKm = currentRadarMaxKm * 1.35;
  const nbEtapes = 8;
  for(let i = nbEtapes; i >= 1; i--){
    const distStep = (distanceArriereMaxKm / nbEtapes) * i;
    const rLat = currentPlane.baseLat - (distStep * Math.cos(trackRad)) / 110.574;
    const rLon = currentPlane.baseLon - (distStep * Math.sin(trackRad)) / (111.320 * Math.cos(currentPlane.baseLat * Math.PI / 180));
    retroPoints.push(projeterSurRadar(currentPos, rLat, rLon, currentRadarMaxKm));
  }

  const trajetComplet = [...retroPoints, ...pointsTrajet, ptActuel];

  const polylineCoords = trajetComplet.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const pointsEtapes = trajetComplet.slice(0, -1).map((p, idx) => {
    const opac = (0.10 + (idx / trajetComplet.length) * 0.65).toFixed(2);
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="#ffd23f" opacity="${opac}"/>`;
  }).join("");

  const futLen = 22;
  const futX = ptActuel.x + futLen * Math.sin(trackRad);
  const futY = ptActuel.y - futLen * Math.cos(trackRad);

  layer.innerHTML = `
    <polyline points="${polylineCoords}" fill="none" stroke="#ffd23f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    ${pointsEtapes}
    <line x1="${ptActuel.x.toFixed(1)}" y1="${ptActuel.y.toFixed(1)}" x2="${futX.toFixed(1)}" y2="${futY.toFixed(1)}" 
          stroke="#ffd23f" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.8"/>
    <g transform="translate(${ptActuel.x.toFixed(1)}, ${ptActuel.y.toFixed(1)})">
      <g transform="rotate(${track})">
        <path d="M0 -11 L6 5 L0 2 L-6 5 Z" fill="#ffd23f"/>
      </g>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ffd23f" stroke-width="1.2" opacity="0.5"/>
    </g>
  `;
}
requestAnimationFrame(animer);

/* ===== Boucle principale avec transition fluide ===== */
let enCours = false;
async function tick(){
  if(enCours) return; enCours = true;
  let pos = lirePos();
  if(!pos){
    declencherGeolocalisation();
    content.innerHTML = `<div class="empty">En attente de localisation…<br><small style="color:var(--slate)">Autorise l'accès à ta position ou utilise le bouton Coordonnées.</small></div>`;
    enCours = false; return;
  }
  currentPos = pos;
  $("lat").value = pos.lat; $("lon").value = pos.lon;
  try{
    statusEl.textContent = "Recherche…";
    const liste = await chercherAvions(pos);

    if(!liste.length){
      currentPlane = null;
      content.innerHTML = `<div class="empty">Aucun avion de ligne commercial avec itinéraire complet détecté à moins de ${RAYON_SCAN_KM} km pour le moment.</div>`;
      statusEl.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
      enCours = false; return;
    }

    liste.forEach(a => a._d = distanceKm(pos.lat,pos.lon,a.lat,a.lon));
    liste.sort((a,b)=>a._d-b._d);
    const ac = liste[0];

    if(!trajectoireHistory[ac.hex]) trajectoireHistory[ac.hex] = [];
    const hist = trajectoireHistory[ac.hex];
    const lastPoint = hist[hist.length - 1];
    if(!lastPoint || (lastPoint.lat !== ac.lat || lastPoint.lon !== ac.lon)){
      hist.push({ lat: ac.lat, lon: ac.lon });
      if(hist.length > 50) hist.shift();
      sauverHistorique();
    }

    const planeChanged = !currentPlane || currentPlane.hex !== ac.hex;
    const nouvelleEchelle = calculerEchelleRadar(ac._d);
    const zoomChanged = nouvelleEchelle !== currentRadarMaxKm;

    currentPlane = {
      ...ac,
      baseLat: ac.lat,
      baseLon: ac.lon,
      lastUpdate: performance.now()
    };

    if(planeChanged){
      const cont = document.getElementById("main-container");
      if(cont){
        cont.classList.add("fade-out");
        setTimeout(() => {
          dessiner(ac, pos, ac._d, true);
        }, 550);
      } else {
        dessiner(ac, pos, ac._d, true);
      }
    } else if(zoomChanged){
      dessiner(ac, pos, ac._d, false);
    } else {
      const etaEl = document.getElementById("live-eta");
      if(etaEl){
        const eta = estimerHeureArrivee(ac);
        etaEl.innerHTML = `${eta ? eta : "—"}<i>${eta ? "" : "N/D"}</i>`;
      }
    }

    statusEl.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
  }catch(e){
    statusEl.textContent = "Pas de connexion aux données, nouvel essai…";
    if(!document.getElementById("err")){
      content.innerHTML = '<div class="empty" id="err"></div>';
    }
    const box = document.getElementById("err");
    if(box) box.textContent = "Détail : " + e.message;
  }
  enCours = false;
}

tick();
setInterval(tick, RAFRAICHIR_SEC*1000);
</script>
