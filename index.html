<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flash-Éclair plane finder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b111e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b111e;--sky:#16223d;--line:#253557;--sign:#ffd23f;--cloud:#e8eef7;--slate:#8fa1c2;--cyan:#38bdf8;
  --panel-bg:rgba(13,20,36,.6);--radar-beam:#38bdf8;--grid:#253557;
  --plane-fill:#243456;--plane-body:#1b2847;--plane-stroke:#8fa1c2;--vig:rgba(8,12,22,.85);
}
body.night-mode{
  --ink:#080504;--sky:#1c1108;--line:#3d2514;--sign:#ff922b;--cloud:#f8e3d2;--slate:#b88b68;--cyan:#ffa94d;
  --panel-bg:rgba(20,12,6,.7);--radar-beam:#ff922b;--grid:#3d2514;
  --plane-fill:#3a2412;--plane-body:#2a170b;--plane-stroke:#b88b68;--vig:rgba(9,5,3,.88);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh;overflow:hidden}
body{background:radial-gradient(1400px 900px at 70% -10%,var(--sky),var(--ink) 70%) fixed;color:var(--cloud);font-family:Barlow,system-ui,sans-serif;padding:8px 16px;transition:background .8s ease,color .8s ease}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:6px;flex-shrink:0}
.brand-title{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;line-height:1}
.brand-title .highlight{color:var(--sign)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--sign);box-shadow:0 0 10px var(--sign);animation:blink 1.8s ease-in-out infinite alternate}
@keyframes blink{0%{opacity:.35;transform:scale(.85)}100%{opacity:1;transform:scale(1.15)}}
#status{font-family:'JetBrains Mono',monospace;font-size:11px;color:#f59e0b;margin-left:12px}
.btn-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--cloud);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .3s ease}
button:hover{border-color:var(--slate);background:rgba(255,255,255,.04)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.btn-night.active{background:rgba(255,146,43,.14);border-color:var(--sign);color:var(--sign);font-weight:600}
main{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;align-items:stretch;flex:1;min-height:0}
@media (max-width:920px){main{grid-template-columns:1fr;gap:12px;overflow-y:auto}}
.fade-out{opacity:0;transform:scale(.97);transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1)}
.fade-in{animation:arriveAvion 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes arriveAvion{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
.col-left,.col-right{display:flex;flex-direction:column;gap:8px;justify-content:space-between;min-height:0}
.detection-banner{display:flex;flex-direction:column;gap:2px;background:linear-gradient(90deg,rgba(56,189,248,.12),rgba(27,39,71,.4));border:1px solid rgba(56,189,248,.28);border-radius:8px;padding:6px 12px;box-shadow:0 0 12px rgba(56,189,248,.08);animation:bannerBreath 4s ease-in-out infinite alternate;flex-shrink:0}
@keyframes bannerBreath{0%{border-color:rgba(56,189,248,.25)}100%{border-color:rgba(56,189,248,.5)}}
body.night-mode .detection-banner{background:linear-gradient(90deg,rgba(255,146,43,.12),rgba(35,20,10,.5));border-color:rgba(255,146,43,.3)}
.detection-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.left-info{display:flex;align-items:center;gap:8px}
.beacon{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 1.8s ease-in-out infinite alternate}
.detection-banner .text{font-size:13px;font-weight:500;letter-spacing:.02em}
.distance-tag{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--sign);letter-spacing:.04em}
.cardinal-line{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cyan);letter-spacing:.04em;padding-left:17px}
body.night-mode .cardinal-line{color:var(--sign)}

.identity-block{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.airline-badge{display:inline-flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(36px,4.5vw,56px);line-height:1;letter-spacing:.03em;padding:4px 14px;border-radius:8px;margin-bottom:2px;text-transform:uppercase;box-shadow:0 3px 12px rgba(0,0,0,.4);width:fit-content}
.airline-logo-icon{display:inline-flex;width:28px;height:28px;flex-shrink:0}
.airline-logo-icon svg{width:100%;height:100%}
.callsign{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--sign);letter-spacing:.08em;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.3);padding:2px 8px;border-radius:5px;width:fit-content;margin-bottom:2px}
.model{font-size:17px;font-weight:600;margin-top:2px}

.route-box{background:rgba(22,34,61,.55);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden;flex-shrink:0}
body.night-mode .route-box{background:rgba(28,17,8,.55)}
.route-main{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:36px;color:#fff;letter-spacing:.05em;display:flex;align-items:center;gap:12px;line-height:1}
.route-flag{font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.route-arrow-wrap{display:inline-flex;color:var(--sign);font-size:26px;animation:arrowFlight 2.2s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes arrowFlight{0%,100%{transform:translateX(-3px) scale(.95);opacity:.8}50%{transform:translateX(5px) scale(1.08);opacity:1}}
.route-sub{font-size:14px;font-weight:500;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.route-sub span{background:rgba(0,0,0,.32);padding:4px 8px;border-radius:5px;border-left:3px solid var(--sign)}
.progress-wrap{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.progress-bar-bg{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--sign));border-radius:3px;transition:width 1.2s ease;position:relative}
.progress-bar-fill::after{content:'';position:absolute;top:0;left:-40px;width:40px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:progressShine 2.5s ease-in-out infinite}
@keyframes progressShine{0%{transform:translateX(0)}100%{transform:translateX(900px)}}
.progress-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--slate)}
.progress-subtext{font-size:9.5px;color:var(--cyan);letter-spacing:.04em}
.plane-canvas{aspect-ratio:16/6.2;border-radius:10px;background:linear-gradient(145deg,#131c31,#0a0f1c);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 25px rgba(0,0,0,.65);flex-shrink:1;min-height:90px}
body.night-mode .plane-canvas{background:linear-gradient(145deg,#180f08,#0a0604)}
.artificial-horizon{position:absolute;width:100%;height:100%;pointer-events:none;opacity:.35;transition:transform 1s cubic-bezier(.2,.8,.4,1)}
.wind-stream{position:absolute;width:1.5px;background:linear-gradient(to bottom,transparent,var(--cyan),transparent);border-radius:2px;animation:windFlow linear infinite;pointer-events:none}
@keyframes windFlow{0%{transform:translateY(-120px);opacity:0}30%,80%{opacity:.8}100%{transform:translateY(280px);opacity:0}}
.plane-canvas svg.blueprint{width:80%;height:80%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));animation:flightVibe 4.5s ease-in-out infinite alternate;z-index:1}
@keyframes flightVibe{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(.4deg)}100%{transform:translateY(2px) rotate(-.3deg)}}
.pw{fill:var(--plane-fill);stroke:var(--plane-stroke);stroke-width:1.8}
.pb{fill:var(--plane-body);stroke:var(--sign);stroke-width:2}
.pe{fill:var(--sign)}
.nav-beacon{animation:beaconFlash 1.2s infinite ease-in-out}
@keyframes beaconFlash{0%,75%,100%{opacity:.25}85%{opacity:1}}
.nav-strobe{animation:strobeFlash 1.5s infinite steps(1,start)}
@keyframes strobeFlash{0%,92%,100%{opacity:0}94%,97%{opacity:1}95%{opacity:0}}
.nav-fixed-red{filter:drop-shadow(0 0 4px #ef4444)}
.nav-fixed-green{filter:drop-shadow(0 0 4px #10b981)}
.plane-hud-badge{position:absolute;top:8px;left:10px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--sign);background:rgba(11,17,30,.85);padding:2px 6px;border-radius:3px;border:1px solid rgba(255,210,63,.3);letter-spacing:.08em;z-index:2}
.plane-hud-type{position:absolute;bottom:8px;right:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--slate);z-index:2}
.radar-wrapper{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.radar-box{width:100%;height:100%;position:relative;border-radius:12px;background:radial-gradient(ellipse at center,rgba(19,34,63,.45) 0%,rgba(9,14,26,.88) 75%);border:1px solid rgba(37,53,87,.5);box-shadow:inset 0 0 35px rgba(0,0,0,.7),0 4px 20px rgba(0,0,0,.35);overflow:hidden}
body.night-mode .radar-box{background:radial-gradient(ellipse at center,rgba(32,19,9,.5) 0%,rgba(9,5,3,.92) 75%);border-color:rgba(61,37,20,.5)}
.radar-box::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,var(--vig) 100%)}
.radar-box svg{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;flex-shrink:0}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:10px 8px;background:var(--panel-bg);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;justify-content:center;opacity:0;animation:statReveal .9s cubic-bezier(.16,1,.3,1) forwards}
.stat:nth-child(2){animation-delay:.1s}.stat:nth-child(3){animation-delay:.2s}.stat:nth-child(4){animation-delay:.3s}
@keyframes statReveal{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1}
.stat .v i{font-style:normal;font-size:13px;font-weight:500;color:var(--slate);margin-left:3px}
.stat .l{font-size:10px;color:var(--slate);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.vario-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;margin-top:3px}
.vario-up{color:#10b981}.vario-down{color:#f59e0b}.vario-level{color:var(--slate)}
.phase-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.06);letter-spacing:.05em;margin-top:2px;width:fit-content}
.phase-cruise{color:var(--cyan);border:1px solid rgba(56,189,248,.3)}
.phase-descent{color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.phase-climb{color:#10b981;border:1px solid rgba(16,185,129,.3)}
.metric-flash{animation:metricPulse .5s ease-out}
@keyframes metricPulse{0%{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}100%{color:inherit;text-shadow:none}}
.nearby-queue{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 0}
.queue-item{background:rgba(22,34,61,.45);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--slate);cursor:pointer;white-space:nowrap;display:inline-flex;gap:5px;transition:all .2s ease}
.queue-item:hover{border-color:var(--cyan);color:var(--cloud);background:rgba(56,189,248,.12)}
.queue-item.active{border-color:var(--sign);color:var(--sign);background:rgba(255,210,63,.12);font-weight:600}
.queue-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
.tactical-idle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px;flex:1;min-height:0;animation:arriveAvion 1s ease forwards}
.tactical-status{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;flex-shrink:0}
.tactical-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.tactical-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--slate);letter-spacing:.08em}
.empty{text-align:center;padding:40px 10px;color:var(--slate);font-size:17px;line-height:1.6;animation:arriveAvion 1s ease forwards}
.settings{border:1px solid var(--line);border-radius:10px;padding:12px;display:none;gap:10px;flex-wrap:wrap;align-items:end;background:#0d1424aa}
.settings.open{display:flex}
.settings label{display:flex;flex-direction:column;font-size:12px;color:var(--slate);gap:3px}
.settings input{font:inherit;color:var(--cloud);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;width:150px}
.settings .hint{flex-basis:100%;font-size:12px;color:var(--slate)}
.settings .go{background:var(--sign);color:var(--ink);border-color:var(--sign);font-weight:600}
.btn-geo{background:rgba(56,189,248,.1);border-color:var(--cyan);color:var(--cyan);font-weight:500}
@media (prefers-reduced-motion:reduce){.wind-stream,.nav-strobe{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center">
      <div class="brand-title"><span class="live-dot"></span>FLASH-ÉCLAIR <span class="highlight">PLANE FINDER</span></div>
      <span id="status"></span>
    </div>
    <div class="btn-group">
      <button id="btn-night" class="btn-night" type="button" title="Mode Automatique">☀️ 🔄</button>
      <button id="btn-gps" class="btn-geo" type="button" title="Me géolocaliser">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
        GPS
      </button>
      <button id="cfg" type="button">Coordonnées</button>
    </div>
  </header>

  <section class="settings" id="settings">
    <label>Latitude<input id="lat" inputmode="decimal" placeholder="ex. 44.1132"></label>
    <label>Longitude<input id="lon" inputmode="decimal" placeholder="ex. 4.9084"></label>
    <button class="go" id="save" type="button">Enregistrer</button>
    <button class="btn-geo" id="btn-gps-settings" type="button">Obtenir ma position GPS</button>
    <p class="hint">Astuce : le bouton GPS remplit automatiquement tes coordonnées précises via le navigateur.</p>
  </section>

  <div id="content" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));caches.keys().then(k=>k.forEach(n=>caches.delete(n)))}

const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const RAYON_SCAN_KM=90, RAFRAICHIR_SEC=4;
const content=$("content");
const arrondi=n=>Math.round(n).toLocaleString("fr-FR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flagOf=cc=>cc&&cc.length===2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>c.charCodeAt(0)+127397)):"✈️";
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ================= DONNÉES ================= */
const LOGOS={
  V:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffcc00"/><circle cx="12" cy="12" r="4.5" fill="#111"/></svg>',
  AF:'<svg viewBox="0 0 24 24"><path d="M3 18 L21 6 L16 20 Z" fill="#da291c"/></svg>',
  R:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0d2b70"/><path d="M7 14 C10 8 15 8 18 10 C14 13 10 14 7 14 Z" fill="#ffd23f"/></svg>',
  E:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff6600"/><path d="M8 12 L16 8 L14 16 Z" fill="#fff"/></svg>',
  T:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#00d66c" stroke-width="3" fill="none"/><circle cx="12" cy="12" r="3" fill="#00d66c"/></svg>',
  L:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#05164d"/><path d="M6 14C10 11 14 10 18 8C14 12 11 14 8 16Z" fill="#ffd23f"/></svg>',
  N:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#d81920"/><path d="M6 15 L12 9 L18 15 Z" fill="#fff"/></svg>',
  G:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="currentColor"/></svg>'
};
const AL={};
`NOZ,NAX,DY,D8|Norwegian|d81920|fff|N
VLG,VY|Vueling Airlines|ffcc00|111|V
AFR,AF|Air France|002157|fff|AF
HOP,A5|Air France Hop|da291c|fff|AF
RYR,FR,RYS,RK|Ryanair|0d2b70|ffd23f|R
EZY,U2,EZS,DS|easyJet|ff6600|fff|E
TVF,TO,TRA,HV|Transavia|00d66c|000|T
DLH,LH|Lufthansa|05164d|ffd23f|L
IBE,IB|Iberia|d71920|fff|G
BAW,BA|British Airways|075aaa|fff|G
KLM,KL|KLM Royal Dutch|00a1de|fff|G
SWR,LX|Swiss Intl Air Lines|e30613|fff|G
BEL,SN|Brussels Airlines|0c2340|fff|G
TAP,TP|TAP Air Portugal|008543|fff|G
WZZ,W6|Wizz Air|c6007e|fff|G
VOE,V7|Volotea|7a1315|fff|G
UAE,EK|Emirates|d71920|fff|G
QTR,QR|Qatar Airways|5c0632|fff|G
THY,TK|Turkish Airlines|c8102e|fff|G
DAH,AH|Air Algérie|c8102e|fff|G
TAR,TU|Tunisair|c8102e|fff|G
RAM,AT|Royal Air Maroc|b91c1c|fff|G`.split("\n").forEach(l=>{
  const [c,n,bg,fg,lg]=l.split("|");
  c.split(",").forEach(k=>AL[k]={nom:n,color:"#"+bg,text:"#"+fg,logo:LOGOS[lg]});
});

function resoudreCompagnie(ac){
  for(const s of [ac.flight,ac.callsign]){
    const c=String(s||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase();
    if(/^[A-Z]{3}\d/.test(c)&&AL[c.slice(0,3)]) return AL[c.slice(0,3)];
    if(/^[A-Z0-9]{2}\d/.test(c)&&AL[c.slice(0,2)]) return AL[c.slice(0,2)];
  }
  return null;

/* ================= GÉOMÉTRIE ================= */
function distanceKm(la1,lo1,la2,lo2){
  const R=6371,r=Math.PI/180;
  const a=Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function gisement(la1,lo1,la2,lo2){
  const r=Math.PI/180,y=Math.sin((lo2-lo1)*r)*Math.cos(la2*r);
  const x=Math.cos(la1*r)*Math.sin(la2*r)-Math.sin(la1*r)*Math.cos(la2*r)*Math.cos((lo2-lo1)*r);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

const TIERS=[[15,18],[30,36],[55,60],[1e9,90]];

function echelleCible(d,cur){
  for(const [lim,s] of TIERS){ if(d<=(s<cur?lim*.9:lim)) return s; }
  return 90;
}

function livePos(p,now){
  const dt=(now-p.t0)/1000, dtc=Math.min(dt,30);
  const d=(p.gs||0)*1.852/3600*dtc, tr=(p.track||0)*Math.PI/180, k=Math.exp(-dt/1.5);
  return {
    lat:p.lat0+d*Math.cos(tr)/110.574+p.offLat*k,
    lon:p.lon0+d*Math.sin(tr)/(111.32*Math.cos(p.lat0*Math.PI/180))+p.offLon*k
  };
}

function proj(lat,lon,clamp=true){
  const dist=distanceKm(currentPos.lat,currentPos.lon,lat,lon), az=gisement(currentPos.lat,currentPos.lon,lat,lon);
  const pk=112/scaleDisp, a=(az-90)*Math.PI/180;
  let x=dist*pk*Math.cos(a), y=dist*pk*Math.sin(a);
  if(clamp){const f=Math.min(1,160/Math.abs(x||1e-9),108/Math.abs(y||1e-9)); x*=f; y*=f;}
  return {x:200+x,y:140+y,dist,az};
}

function jsonpFR24(url,ms=7000){
  return new Promise((resolve,reject)=>{
    const cb="fr24_cb_"+Math.random().toString(36).slice(2,9), s=document.createElement("script");
    let t=setTimeout(()=>{cleanup();reject(new Error("Délai dépassé"))},ms);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error("Erreur de chargement"))};
    s.src=`${url}${url.includes("?")?"&":"?"}callback=${cb}`;
    document.head.appendChild(s);
  });
}
const HELICO=/^(EC\d\d|H\d{3}$|R22|R44|R66|AS\d\d|A1[0-9]9|B06|B4\d\d|S76|S92|UH60|NH90|MI\d)/;
async function chercherAvions(pos){
  const dLat=RAYON_SCAN_KM/111.32, dLon=dLat/Math.max(.2,Math.cos(pos.lat*Math.PI/180));
  const b=[pos.lat+dLat,pos.lat-dLat,pos.lon-dLon,pos.lon+dLon].map(v=>v.toFixed(4)).join(",");
  const j=await jsonpFR24(`https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${b}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=0&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`);
  const liste=[];
  for(const k of Object.keys(j)){
    if(["full_count","version","stats"].includes(k)) continue;
    const d=j[k];
    if(!Array.isArray(d)||typeof d[1]!=="number"||typeof d[2]!=="number") continue;
    const origin=(d[11]||"").trim().toUpperCase(), dest=(d[12]||"").trim().toUpperCase();
    const callsign=(d[16]||"").trim(), flight=(d[13]||"").trim()||callsign;
    const t=(d[8]||"").toUpperCase().trim(), alt=d[4];

    const prof=detecterProfil(t);
    const estTourisme=prof.type==="LIGHT_PROP"||prof.type==="TWIN_PROP";

    if(origin.length===3&&dest.length===3&&flight.length>=2&&typeof alt==="number"&&alt>100&&!HELICO.test(t)&&!estTourisme){
      liste.push({hex:d[0],lat:d[1],lon:d[2],track:d[3],alt_baro:alt,gs:d[5],t,r:(d[9]||"").trim(),
        vs:typeof d[15]==="number"?d[15]:null,origin,dest,flight,callsign});
    }
  }
  return liste;
}

function majFleet(liste,now){
  const vus=new Set();
  for(const a of liste){
    vus.add(a.hex);
    const o=fleet[a.hex];
    if(o&&o.lat0===a.lat&&o.lon0===a.lon){
      Object.assign(o,{alt_baro:a.alt_baro,gs:a.gs,track:a.track,vs:a.vs,t:a.t,origin:a.origin,dest:a.dest});
      continue;
    }
    let oLa=0,oLo=0;
    if(o){const l=livePos(o,now); oLa=l.lat-a.lat; oLo=l.lon-a.lon; if(Math.abs(oLa)>.1||Math.abs(oLo)>.1) oLa=oLo=0;}
    fleet[a.hex]={...a,lat0:a.lat,lon0:a.lon,t0:now,offLat:oLa,offLon:oLo};
    const h=hist[a.hex]||(hist[a.hex]=[]);
    h.push({t:Date.now(),lat:a.lat,lon:a.lon});
    if(h.length>45) h.shift();
  }
  for(const h in fleet) if(!vus.has(h)){delete fleet[h];delete vh[h];}
}

function calcVario(ac){
  let r=typeof ac.vs==="number"?ac.vs:null;
  if(r===null){
    const now=performance.now(), h=vh[ac.hex]||(vh[ac.hex]={alt:ac.alt_baro,t:now,r:0}), dt=(now-h.t)/1000;
    if(ac.alt_baro!==h.alt&&dt>=2){h.r=h.r*.5+(ac.alt_baro-h.alt)/dt*60*.5;h.alt=ac.alt_baro;h.t=now}
    else if(dt>30){h.r*=.5;h.t=now}
    r=h.r;
  }
  r=Math.round(r);
  if(r>150) return {texte:`▲ +${r} ft/min`,classe:"vario-up",rate:r};
  if(r<-150) return {texte:`▼ ${r} ft/min`,classe:"vario-down",rate:r};
  return {texte:"▶ Palier",classe:"vario-level",rate:r};
}
function phaseVol(alt,rate){
  if(typeof alt!=="number") return {label:"EN ROUTE",classe:"phase-cruise"};
  if(alt>=28000&&Math.abs(rate)<300) return {label:"CROISIÈRE",classe:"phase-cruise"};
  if(rate<=-400) return {label:alt<10000?"DESCENTE APPROCHE":"DESCENTE",classe:"phase-descent"};
  if(rate>=400) return {label:alt<10000?"MONTÉE INITIALE":"MONTÉE",classe:"phase-climb"};
  return {label:"EN ROUTE",classe:"phase-cruise"};
}
function trajet(ac,l){
  const dest=formatAirport(ac.dest), dep=formatAirport(ac.origin);
  const kmh=(typeof ac.gs==="number"&&ac.gs>40)?ac.gs*1.852:null;
  const out={eta:null,reste:"",pct:null};
  if(dest.lat!==null){
    const rest=distanceKm(l.lat,l.lon,dest.lat,dest.lon);
    if(kmh){
      const hrs=rest/kmh, d=new Date(Date.now()+hrs*3600000);
      out.eta=`${String(d.getHours()).padStart(2,"0")}h${String(d.getMinutes()).padStart(2,"0")}`;
      const h=Math.floor(hrs), m=Math.round((hrs-h)*60);
      out.reste=`Reste : ${h>0?`${h}h${String(m).padStart(2,"0")}`:`${m} min`} • ${Math.round(rest)} km`;
    }
    if(dep.lat!==null){
      const tot=distanceKm(dep.lat,dep.lon,dest.lat,dest.lon);
      if(tot>10) out.pct=Math.min(Math.max(Math.round(distanceKm(dep.lat,dep.lon,l.lat,l.lon)/tot*100),5),98);
    }
    if(out.pct===null) out.pct=rest<200?85:rest<500?65:45;
  }
  return out;
}

function detecterProfil(t){

  if(/^(A38|A34|B74|C17$|AN1|A400)/.test(u)) return {type:"HEAVY_QUAD",label:"Très Gros Porteur Quadrimoteur"};
  if(/^(A35|B77|B78|A33|B76)/.test(u)) return {type:"WIDEBODY_TWIN",label:"Long-Courrier Gros Porteur"};
  if(/^(AT[4-7]\d|DH8|B350|BE20|BE9|BE30|PC12|TBM|C208|SF34|SB20|L410)/.test(u)) return {type:"TURBOPROP",label:"Turbopropulseur"};

  if(/^(BE5\d|BE76|PA3[1-4]|PA44|DA42|DA62|P68|C3\d\d$|C4\d\d$)/.test(u)) return {type:"TWIN_PROP",label:"Bimoteur à Hélices"};

}

const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const R={};
function bindRadar(){
  const root=document.querySelector(".radar-box svg"); if(!root) return false;
  if(R.root===root) return true;
  for(const k in R) delete R[k];
  Object.assign(R,{root,beam:$("beam"),l:[$("rl1"),$("rl2"),$("rl3")],sec:{},col:null,tr:null,lastQ:0,lastDs:"",lastTrajUpdate:0});
  const ml=$("rml");
  if(ml){
    R.ml=ml; R.secg=$("rsl");
    R.contrail=mk("line",{"stroke":"rgba(255,255,255,.4)","stroke-width":4.5,"stroke-linecap":"round",opacity:.3},$("rcl"));
    R.tline=mk("polyline",{fill:"none","stroke-width":2.5,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.65},ml);
    R.tdots=mk("polyline",{fill:"none","stroke-width":3.2,"stroke-linecap":"round","stroke-dasharray":"0 7",opacity:.55},ml);
    R.pline=mk("line",{"stroke-width":1.8,"stroke-dasharray":"3 4"},ml);
    R.pdot=mk("circle",{r:2},ml);
    R.g=mk("g",{},ml); R.gr=mk("g",{},R.g);
    R.gpath=mk("path",{d:"M0 -11L6 5L0 2L-6 5Z"},R.gr);
    R.gbox=mk("rect",{x:-8,y:-8,width:16,height:16,rx:3,fill:"none","stroke-width":1.2},R.g);
    syncSec();
  }
  return true;
}

function syncSec(){
  if(!R.secg) return;
  const keep=new Set();
  for(const h in fleet){
    if(h===selHex) continue; keep.add(h);
    let g=R.sec[h];
    if(!g){
      g=R.sec[h]=mk("g",{opacity:.38},R.secg);
      g.innerHTML=`<g><polygon points="0,-4 3,3 -3,3" fill="#8fa1c2"/></g><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="none" stroke="#8fa1c2" stroke-width=".8"/>`;
    }
    g.firstChild.setAttribute("transform",`rotate(${fleet[h].track||0})`);
  }
  for(const h in R.sec) if(!keep.has(h)){R.sec[h].remove();delete R.sec[h];}
}

let lastFrame=0;
function animer(now){
  requestAnimationFrame(animer);
  if(!bindRadar()) return;
  const dt=Math.min(.05,(now-(lastFrame||now))/1000); lastFrame=now;

  /* zoom progressif */
  const dz=scaleTarget-scaleDisp;
  scaleDisp=Math.abs(dz)<.03?scaleTarget:scaleDisp+dz*(1-Math.exp(-dt*4));
  for(let i=0;i<3;i++){const t=Math.round(scaleDisp*(i+1)/3)+" km"; if(R.l[i]&&R.l[i].textContent!==t) R.l[i].textContent=t;}

  /* balayage laser */
  const per=R.ml?4500:7000, p=(now%per)/per, bx=20+p*360;
  R.beam.setAttribute("transform",`translate(${bx.toFixed(1)} 0)`);
  R.beam.setAttribute("opacity",Math.min(1,p*20,(1-p)*20).toFixed(2));
  if(!R.ml||transitioning||!selHex||!fleet[selHex]||!currentPos) return;

  const ac=fleet[selHex], l=livePos(ac,performance.now()), pt=proj(l.lat,l.lon);
  const track=typeof ac.track==="number"?ac.track:0, tr=track*Math.PI/180, sn=Math.sin(tr), cs=Math.cos(tr);
  const altM=typeof ac.alt_baro==="number"?ac.alt_baro*.3048:null, col=couleurSelonAltitude(altM);

  if(R.col!==col){
    R.col=col;
    for(const k of ["tline","tdots","pline"]) R[k].setAttribute("stroke",col);
    R.pdot.setAttribute("fill",col); R.gpath.setAttribute("fill",col); R.gbox.setAttribute("stroke",col);
  }
  if(R.tr!==track){R.tr=track; R.gr.setAttribute("transform",`rotate(${track})`);}

  /* trajectoire mémorisée : cadencée pour soulager le GPU de la tablette */
  if(!R.lastTrajUpdate||now-R.lastTrajUpdate>800){
    R.lastTrajUpdate=now;
    const pts=(hist[selHex]||[]).map(h=>{const a=proj(h.lat,h.lon,false);return a.x.toFixed(1)+","+a.y.toFixed(1)});
    pts.push(pt.x.toFixed(1)+","+pt.y.toFixed(1));
    const ps=pts.join(" "); R.tline.setAttribute("points",ps); R.tdots.setAttribute("points",ps);
  }

  R.contrail.setAttribute("x1",(pt.x-26*sn).toFixed(1)); R.contrail.setAttribute("y1",(pt.y+26*cs).toFixed(1));
  R.contrail.setAttribute("x2",pt.x.toFixed(1)); R.contrail.setAttribute("y2",pt.y.toFixed(1));

  const gsKmh=(ac.gs||0)*1.852, pred=Math.min((gsKmh/60*2/scaleDisp)*112,70);
  const px=pt.x+pred*sn, py=pt.y-pred*cs;
  const ph=Math.max(.45,1.3-Math.abs(bx-pt.x)/160);
  R.pline.setAttribute("x1",pt.x.toFixed(1)); R.pline.setAttribute("y1",pt.y.toFixed(1));
  R.pline.setAttribute("x2",px.toFixed(1)); R.pline.setAttribute("y2",py.toFixed(1));
  R.pline.setAttribute("opacity",Math.min(1,.85*ph).toFixed(2));
  R.pdot.setAttribute("cx",px.toFixed(1)); R.pdot.setAttribute("cy",py.toFixed(1)); R.pdot.setAttribute("opacity",(.7*ph).toFixed(2));
  R.g.setAttribute("transform",`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
  R.gpath.setAttribute("opacity",Math.min(1,ph).toFixed(2)); R.gbox.setAttribute("opacity",(.6*ph).toFixed(2));

  for(const h in R.sec){
    const o=fleet[h]; if(!o) continue;
    const lo=livePos(o,performance.now()), a=proj(lo.lat,lo.lon);
    R.sec[h].setAttribute("transform",`translate(${a.x.toFixed(1)} ${a.y.toFixed(1)})`);
  }

  /* textes : écrits seulement quand ils changent */
  const ds=pt.dist.toFixed(1).replace(".",",");
  if(ds!==R.lastDs){
    R.lastDs=ds;
    const bd=$("banner-distance"), ld=$("live-distance"), cd=$("cardinal-text");
    if(bd) bd.textContent=ds+" km";
    if(ld) ld.innerHTML=ds+"<i>km</i>";
    if(cd) cd.textContent=`Position : ${traduireGisementEnTexte(pt.az)}${traduireCapEnTexte(track)}`;
  }
  if(now-R.lastQ>500){
    R.lastQ=now;
    document.querySelectorAll(".queue-item").forEach(it=>{
      const o=fleet[it.dataset.hex], s=it.querySelector(".qd"); if(!o||!s) return;
      const lo=livePos(o,performance.now()), t=Math.round(distanceKm(currentPos.lat,currentPos.lon,lo.lat,lo.lon))+" km";
      if(s.textContent!==t) s.textContent=t;
    });
  }
}

/* ================= BOUCLE DE DONNÉES ================= */
function setStatus(t){const e=$("status"); if(e) e.textContent=t;}
async function tick(){
  if(busy) return; busy=true;
  const pos=lirePos();
  if(!pos){
    if(mode!=="wait"){
      mode="wait"; declencherGeolocalisation();
      content.innerHTML=`<div class="empty">En attente de localisation…<br><small style="color:var(--slate)">Autorise l'accès à ta position ou utilise le bouton Coordonnées.</small></div>`;
    }
    busy=false; return;
  }
  currentPos=pos;
  try{
    const liste=await chercherAvions(pos);
    fails=0; setStatus("");
    const now=performance.now();
    majFleet(liste,now);
    sauverHistorique();
    if(!liste.length){afficherVeille(); busy=false; return;}
    for(const h in fleet){const p=fleet[h], l=livePos(p,now); p._d=distanceKm(pos.lat,pos.lon,l.lat,l.lon);}
    const tri=Object.values(fleet).sort((a,b)=>a._d-b._d);
    if(selManual&&!fleet[selHex]) selManual=false;
    let cur=fleet[selHex];
    if(!cur||(!selManual&&tri[0]!==cur&&tri[0]._d<cur._d)) cur=tri[0];
    scaleTarget=echelleCible(cur._d,scaleTarget);
    if(cur.hex!==selHex||mode!=="plane"){ if(!transitioning||cur.hex!==selHex) basculer(cur.hex); }
    else if(!transitioning){ majStats(cur); majQueue(); syncSec(); }
  }catch(e){
    fails++; if(fails>=3) setStatus("⚠ Connexion perdue… nouvelle tentative");
  }
  busy=false;
}

function lirePos(){
  const p=lsGet("pos",null);
  if(p&&isFinite(p.lat)&&isFinite(p.lon)) return p;
  return window.__pos||null;
}
function ecrirePos(p){window.__pos=p;currentPos=p;lsSet("pos",p);}
function declencherGeolocalisation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const p={lat:+pos.coords.latitude.toFixed(5),lon:+pos.coords.longitude.toFixed(5)};
    ecrirePos(p); $("lat").value=p.lat; $("lon").value=p.lon; $("settings").classList.remove("open"); tick();
  },()=>{if(!lirePos()) $("settings").classList.add("open");},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
let modeNuit=localStorage.getItem("cockpit_night_setting")||"auto";
const estNuit=()=>{const h=new Date().getHours();return h>=17||h<7};
function actualiserThemeNuit(){
  const btn=$("btn-night"); let actif;
  if(modeNuit==="auto"){actif=estNuit();btn.textContent=actif?"🌙 🔄":"☀️ 🔄";btn.title="Mode Nuit (Automatique 17h-7h)";}
  else{actif=modeNuit==="true";btn.textContent=actif?"🌙":"☀️";btn.title=actif?"Mode Nuit (Forcé)":"Mode Jour (Forcé)";}
  document.body.classList.toggle("night-mode",actif); btn.classList.toggle("active",actif);
}
$("btn-night").onclick=()=>{
  modeNuit=modeNuit==="auto"?"true":modeNuit==="true"?"false":"auto";
  localStorage.setItem("cockpit_night_setting",modeNuit); actualiserThemeNuit();
};
setInterval(()=>{if(modeNuit==="auto") actualiserThemeNuit()},60000);
$("cfg").onclick=()=>$("settings").classList.toggle("open");
$("btn-gps").onclick=declencherGeolocalisation;
$("btn-gps-settings").onclick=declencherGeolocalisation;
$("save").onclick=()=>{
  const lat=parseFloat($("lat").value.replace(",",".")), lon=parseFloat($("lon").value.replace(",","."));
  if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return;
  ecrirePos({lat,lon}); $("settings").classList.remove("open"); mode=""; tick();
};

/* Écran toujours allumé */
async function garderEcranAllume(){try{if("wakeLock" in navigator) await navigator.wakeLock.request("screen");}catch(e){}}
garderEcranAllume();
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") garderEcranAllume(); else sauverHistorique(true);
});

{const p=lirePos(); if(p){$("lat").value=p.lat;$("lon").value=p.lon;}}
