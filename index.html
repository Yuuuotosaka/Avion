<style>
:root{
  --ink:#0b111e; --sky:#16223d; --line:#253557; --sign:#ffd23f; --cloud:#e8eef7; --slate:#8fa1c2; --cyan:#38bdf8;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, var(--sky), var(--ink) 70%) fixed;
  color:var(--cloud); font-family:Barlow,system-ui,sans-serif; padding:20px;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:12px}
header h1{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;color:var(--slate);letter-spacing:.06em}
#status{font-size:13px;color:var(--slate);font-family:'JetBrains Mono',monospace}
button{font:inherit;color:var(--cloud);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sign);outline-offset:2px}

main{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:stretch}
@media (max-width:820px){main{grid-template-columns:1fr}}

.left{display:flex;flex-direction:column;gap:16px}

/* Illustration Blueprint HUD */
.plane-canvas{
  aspect-ratio:16/10;
  border-radius:14px;
  background:linear-gradient(145deg, #131c31, #0a0f1c);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 30px rgba(0,0,0,0.6);
}
.plane-canvas svg.blueprint{
  width:85%; height:85%;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5));
}
.plane-hud-badge{
  position:absolute; top:12px; left:14px;
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color:var(--sign); background:rgba(11,17,30,0.85);
  padding:3px 8px; border-radius:4px;
  border:1px solid rgba(255,210,63,0.3); letter-spacing:.08em;
}
.plane-hud-type{
  position:absolute; bottom:12px; right:14px;
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate);
}

.callsign{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(56px,9vw,96px);line-height:.92;color:var(--sign)}
.model{font-size:18px;color:var(--cloud);margin-top:2px}

/* Route & Aéroports complets */
.route-box{
  background:rgba(22,34,61,0.45);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.route-main{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:24px;
  color:var(--cloud);
  display:flex;
  align-items:center;
  gap:10px;
}
.route-arrow{color:var(--sign);font-size:20px}
.route-sub{font-size:13px;color:var(--slate);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.right{display:flex;flex-direction:column;gap:16px}

/* Mini Carte Radar Tactique */
.radar-box{
  aspect-ratio:1;
  max-width:320px;
  width:100%;
  margin:0 auto;
  position:relative;
  border-radius:50%;
  background:radial-gradient(circle, #13223f 0%, #0a1120 75%);
  border:1px solid var(--line);
  box-shadow:0 0 24px rgba(0,0,0,0.4);
  overflow:hidden;
}
.radar-box svg{width:100%;height:100%}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);margin-top:auto}
.stat{padding:12px 4px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.stat:nth-child(even){padding-left:16px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:36px;line-height:1}
.stat .v i{font-style:normal;font-size:16px;font-weight:500;color:var(--slate);margin-left:4px}
.stat .l{font-size:13px;color:var(--slate);margin-top:4px}

.empty{text-align:center;padding:60px 10px;color:var(--slate);font-size:19px}
.settings{border:1px solid var(--line);border-radius:12px;padding:16px;display:none;gap:12px;flex-wrap:wrap;align-items:end;background:#0d1424aa}
.settings.open{display:flex}
.settings label{display:flex;flex-direction:column;font-size:13px;color:var(--slate);gap:4px}
.settings input{font:inherit;color:var(--cloud);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;width:170px}
.settings .hint{flex-basis:100%;font-size:13px;color:var(--slate)}
.settings .go{background:var(--sign);color:var(--ink);border-color:var(--sign);font-weight:600}

function formatAirport(code){
  if(!code || code === "—") return { code: "—", label: "Inconnu" };
  const a = AIRPORTS[code.toUpperCase()];
  if(a) return { code, label: `${a.ville} (${a.nom})` };
  return { code, label: `Aéroport ${code}` };
}

/* ===== Position enregistrée ===== */
function lirePos(){
  try{
    const p = JSON.parse(localStorage.getItem("pos")||"null");
    if(p && isFinite(p.lat) && isFinite(p.lon)) return p;
  }catch(e){}
  return window.__pos || null;
}
function ecrirePos(p){
  window.__pos = p;
  try{ localStorage.setItem("pos", JSON.stringify(p)); }catch(e){}
}

const $ = id => document.getElementById(id);
const content = $("content"), statusEl = $("status");

$("cfg").onclick = () => $("settings").classList.toggle("open");
$("save").onclick = () => {
  const lat = parseFloat($("lat").value.replace(",","."));
  const lon = parseFloat($("lon").value.replace(",","."));
  if(!isFinite(lat) || !isFinite(lon) || Math.abs(lat)>90 || Math.abs(lon)>180){
    statusEl.textContent = "Coordonnées invalides"; return;
  }
  ecrirePos({lat,lon});
  $("settings").classList.remove("open");
  tick();
};

/* ===== Utilitaires ===== */
const POINTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const nomCap = d => POINTS[Math.round(d/22.5)%16];
const arrondi = n => Math.round(n).toLocaleString("fr-FR");
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371, r=Math.PI/180;
  const a=Math.sin((lat2-lat1)*r/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin((lon2-lon1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

// Calcul de gisement (direction de l'avion depuis chez soi en degrés)
function gisement(lat1,lon1,lat2,lon2){
  const r = Math.PI/180;
  const y = Math.sin((lon2-lon1)*r) * Math.cos(lat2*r);
  const x = Math.cos(lat1*r)*Math.sin(lat2*r) - Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos((lon2-lon1)*r);
  return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
}

/* ===== Appel JSONP (contourne CORS) ===== */
function jsonpFR24(url, ms = 7000){
  return new Promise((resolve, reject) => {
    const cbName = "fr24_cb_" + Math.random().toString(36).substring(2, 9);
    const script = document.createElement("script");
    let timer = null;
    window[cbName] = (data) => { cleanup(); resolve(data); };
    function cleanup(){
      if(timer) clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    timer = setTimeout(() => { cleanup(); reject(new Error("Délai dépassé")); }, ms);
    script.onerror = () => { cleanup(); reject(new Error("Erreur de chargement")); };
    const sep = url.includes("?") ? "&" : "?";
    script.src = `${url}${sep}callback=${cbName}`;
    document.head.appendChild(script);
  });
}

async function chercherAvions(pos){
  const deg = RAYON_KM / 111.32;
  const lamin = (pos.lat - deg).toFixed(4);
  const lamax = (pos.lat + deg).toFixed(4);
  const lomin = (pos.lon - deg).toFixed(4);
  const lomax = (pos.lon + deg).toFixed(4);

  const url = `https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${lamax},${lamin},${lomin},${lomax}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`;

  const j = await jsonpFR24(url);
  const liste = [];
  for(const k of Object.keys(j)){
    if(["full_count", "version", "stats"].includes(k)) continue;
    const d = j[k];
    if(Array.isArray(d) && typeof d[1] === "number" && typeof d[2] === "number"){
      liste.push({
        hex: d[0],
        lat: d[1],
        lon: d[2],
        track: d[3],
        alt_baro: d[4],
        gs: d[5],
        t: (d[8] || "").toUpperCase().trim(),
        r: d[9],
        origin: d[11],
        dest: d[12],
        flight: (d[16] || d[13] || "").trim()
      });
    }
  }
  return liste;
}

/* ===== Dessins techniques d'avions (Blueprint) ===== */
function detecterProfil(t){
  if(!t) return { type: "TWIN_JET", label: "Avion de Ligne Bimoteur" };
  if(/^(EC|H1|H2|R22|R44|R66|AS3|A109|A139|B06|B407|B429|S76|UH60)/.test(t)) return { type: "HELICOPTER", label: "Hélicoptère" };
  if(/^(A388|A34|B74|C17|AN12)/.test(t)) return { type: "HEAVY_QUAD", label: "Gros Porteur Quadrimoteur" };
  if(/^(AT4|AT7|DH8|DH4|B350|BE20|PC12|C208|DHC6|TBM)/.test(t)) return { type: "TURBOPROP", label: "Turbopropulseur Régional" };
  if(/^(C5|C25|C56|C68|C75|GLF|GLEX|CL3|CL6|FA7X|FA8X|E55P|E50P|LJ|PRM1|HA4T)/.test(t)) return { type: "BIZJET", label: "Jet d'Affaires Privé" };
  if(/^(C172|C182|C152|PA28|PA38|DR40|SR20|SR22|DA40|DA42|P28A)/.test(t)) return { type: "LIGHT_PROP", label: "Aviation Légère" };
  return { type: "TWIN_JET", label: "Avion de Ligne Bimoteur" };
}

/* ===== Mini-Carte Radar Tactique ===== */
function genererRadar(pos, ac, dist){
  const azimut = gisement(pos.lat, pos.lon, ac.lat, ac.lon);
  const rPixelMax = 120; // rayon du radar en px (cercle 90 km)
  const distRatio = Math.min(dist / RAYON_KM, 1);
  const rPixel = distRatio * rPixelMax;
  const angleRad = (azimut - 90) * (Math.PI / 180);

  const planeX = 150 + rPixel * Math.cos(angleRad);
  const planeY = 150 + rPixel * Math.sin(angleRad);
  const track = typeof ac.track === "number" ? ac.track : 0;

  return `
    <div class="radar-box" aria-label="Carte radar de position relative">
      <svg viewBox="0 0 300 300">
        <!-- Cercles de portée : 30 km, 60 km, 90 km -->
        <circle cx="150" cy="150" r="40" fill="none" stroke="#253557" stroke-width="1" stroke-dasharray="2 4"/>
        <circle cx="150" cy="150" r="80" fill="none" stroke="#253557" stroke-width="1" stroke-dasharray="2 4"/>
        <circle cx="150" cy="150" r="120" fill="none" stroke="#253557" stroke-width="1.5"/>

        <!-- Axes cardinaux -->
        <line x1="150" y1="14" x2="150" y2="286" stroke="#253557" stroke-width="1" opacity="0.5"/>
        <line x1="14" y1="150" x2="286" y2="150" stroke="#253557" stroke-width="1" opacity="0.5"/>
        <g fill="#8fa1c2" font-family="JetBrains Mono" font-size="10" text-anchor="middle">
          <text x="150" y="24">N</text><text x="282" y="153">E</text><text x="150" y="282">S</text><text x="18" y="153">O</text>
          <text x="150" y="106" fill="#8fa1c2" opacity="0.6">30 km</text>
          <text x="150" y="66" fill="#8fa1c2" opacity="0.6">60 km</text>
        </g>

        <!-- Point central : Ta position -->
        <circle cx="150" cy="150" r="4" fill="#38bdf8"/>
        <circle cx="150" cy="150" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

        <!-- Cible radar : L'avion réel -->
        <g transform="translate(${planeX.toFixed(1)}, ${planeY.toFixed(1)})">
          <line x1="0" y1="0" x2="0" y2="-18" stroke="#ffd23f" stroke-width="1.5" stroke-dasharray="2 2" transform="rotate(${track})"/>
          <g transform="rotate(${track})">
            <path d="M0 -9 L5 5 L0 2 L-5 5 Z" fill="#ffd23f"/>
          </g>
          <circle cx="0" cy="0" r="12" fill="none" stroke="#ffd23f" stroke-width="1" opacity="0.45"/>
        </g>
      </svg>
    </div>
  `;
}

/* ===== Affichage Complet ===== */
function dessiner(ac, dist, pos){
  const cap = ac.track;
  const hasCap = typeof cap === "number";
  const alt = ac.alt_baro;
  const auSol = alt === "ground" || alt === 0;
  const altM = (typeof alt === "number") ? alt*0.3048 : null;
  const vitKmh = (typeof ac.gs === "number") ? ac.gs*1.852 : null;
  const nom = (ac.flight||"").trim() || ac.r || ac.hex || "Inconnu";
  const modele = ac.t || "Modèle non renseigné";
  const immat = ac.r ? ` — ${esc(ac.r)}` : "";

  const drawingHtml = genererSvgAvion(ac.t);
  const radarHtml = genererRadar(pos, ac, dist);

  const dep = formatAirport(ac.origin);
  const arr = formatAirport(ac.dest);

  const routeHtml = (ac.origin || ac.dest)
    ? `<div class="route-box">
        <div class="route-main">
          <span>${esc(dep.code)}</span>
          <span class="route-arrow">→</span>
          <span>${esc(arr.code)}</span>
        </div>
        <div class="route-sub">
          <span><b>De :</b> ${esc(dep.label)}</span>
          <span><b>Vers :</b> ${esc(arr.label)}</span>
        </div>
      </div>`
    : `<div class="route-box"><div class="route-sub">Trajet non disponible (plan de vol privé ou absent)</div></div>`;

  content.innerHTML = `
  <main>
    <div class="left">
      ${drawingHtml}
      <div>
        <div class="callsign">${esc(nom)}</div>
        <div class="model">${esc(modele)}${immat}</div>
        ${routeHtml}
      </div>
    </div>
    <div class="right">
      ${radarHtml}
      <div class="stats">
        <div class="stat"><div class="v">${hasCap?Math.round(cap)+"°":"—"}<i>${hasCap?nomCap(cap):""}</i></div><div class="l">Cap magnétique</div></div>
        <div class="stat"><div class="v">${auSol?"Au sol":(altM!==null?arrondi(altM):"—")}<i>${altM!==null?"m":""}</i></div><div class="l">Altitude${altM!==null?` (${arrondi(alt)} ft)`:""}</div></div>
        <div class="stat"><div class="v">${vitKmh!==null?arrondi(vitKmh):"—"}<i>km/h</i></div><div class="l">Vitesse sol</div></div>
        <div class="stat"><div class="v">${dist.toFixed(1).replace(".",",")}<i>km</i></div><div class="l">Distance de toi</div></div>
      </div>
    </div>
  </main>`;
}

/* ===== Boucle principale ===== */
let enCours = false;
async function tick(){
  if(enCours) return; enCours = true;
  const pos = lirePos();
  if(!pos){
    $("settings").classList.add("open");
    content.innerHTML = `<div class="empty">Entre ta latitude et ta longitude pour commencer.</div>`;
    statusEl.textContent = "Position manquante";
    enCours = false; return;
  }
  $("lat").value = pos.lat; $("lon").value = pos.lon;
  try{
    statusEl.textContent = "Recherche…";
    const liste = await chercherAvions(pos);

    if(!liste.length){
      content.innerHTML = `<div class="empty">Aucun avion détecté dans un rayon de ${RAYON_KM} km pour le moment.</div>`;
      statusEl.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
      enCours = false; return;
    }
    liste.forEach(a => a._d = distanceKm(pos.lat,pos.lon,a.lat,a.lon));
    liste.sort((a,b)=>a._d-b._d);
    const ac = liste[0];
    dessiner(ac, ac._d, pos);
    statusEl.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
  }catch(e){
    statusEl.textContent = "Pas de connexion aux données, nouvel essai…";
    if(!document.getElementById("err")){
      content.innerHTML = '<div class="empty" id="err"></div>';
    }
    const box = document.getElementById("err");
    if(box) box.textContent = "Détail : " + e.message;
  }
  enCours = false;
}
tick();
setInterval(tick, RAFRAICHIR_SEC*1000);
</script>
