<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avion le plus proche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1424; --sky:#1b2747; --line:#2c3b63; --sign:#ffd23f; --cloud:#e8eef7; --slate:#8fa1c2;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, var(--sky), var(--ink) 70%) fixed;
  color:var(--cloud); font-family:Barlow,system-ui,sans-serif; padding:20px;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:20px;color:var(--slate);letter-spacing:.04em}
#status{font-size:14px;color:var(--slate)}
button{font:inherit;color:var(--cloud);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sign);outline-offset:2px}

main{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:stretch}
@media (max-width:760px){main{grid-template-columns:1fr}}

.left{display:flex;flex-direction:column;gap:16px}

/* Cadre Illustration HUD */
.plane-canvas{
  aspect-ratio:3/2;
  border-radius:14px;
  background:linear-gradient(145deg, #16223d, #0c1221);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 40px rgba(0,0,0,0.5);
}
.plane-canvas svg.blueprint{
  width:88%;
  height:88%;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,0.45));
}
.plane-hud-badge{
  position:absolute;
  top:12px;
  left:14px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--sign);
  background:rgba(13,20,36,0.75);
  padding:3px 8px;
  border-radius:4px;
  border:1px solid rgba(255,210,63,0.3);
  letter-spacing:.08em;
  text-transform:uppercase;
}
.plane-hud-type{
  position:absolute;
  bottom:10px;
  right:14px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--slate);
  letter-spacing:.06em;
}

.callsign{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(56px,10vw,104px);line-height:.95;color:var(--sign)}
.model{font-size:20px;color:var(--cloud)}
.route{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:clamp(26px,4vw,38px);margin-top:4px}
.route small{display:block;font-family:Barlow,sans-serif;font-size:14px;color:var(--slate);font-weight:400}

.right{display:flex;flex-direction:column;gap:16px}
.dial{position:relative;aspect-ratio:1;width:100%;max-width:340px;margin:0 auto}
.dial svg{width:100%;height:100%}
#plane{transform-origin:150px 150px;transition:transform .8s ease}
.dial .heading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial .heading b{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:700;color:var(--cloud)}
.dial .heading span{font-size:14px;color:var(--slate)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.stat{padding:14px 4px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:14px}
.stat:nth-child(even){padding-left:16px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1}
.stat .v i{font-style:normal;font-size:18px;font-weight:500;color:var(--slate);margin-left:4px}
.stat .l{font-size:14px;color:var(--slate)}

.empty{text-align:center;padding:60px 10px;color:var(--slate);font-size:20px}
.settings{border:1px solid var(--line);border-radius:12px;padding:16px;display:none;gap:12px;flex-wrap:wrap;align-items:end;background:#0d142488}
.settings.open{display:flex}
.settings label{display:flex;flex-direction:column;font-size:14px;color:var(--slate);gap:4px}
.settings input{font:inherit;color:var(--cloud);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;width:170px}
.settings .hint{flex-basis:100%;font-size:13px;color:var(--slate)}
.settings .go{background:var(--sign);color:var(--ink);border-color:var(--sign);font-weight:500}
@media (prefers-reduced-motion:reduce){#plane{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AVION LE PLUS PROCHE</h1>
    <div style="display:flex;gap:12px;align-items:center"><span id="status">Démarrage…</span><button id="cfg" type="button">Ma position</button></div>
  </header>

  <section class="settings" id="settings">
    <label>Latitude<input id="lat" inputmode="decimal" placeholder="ex. 48.8566"></label>
    <label>Longitude<input id="lon" inputmode="decimal" placeholder="ex. 2.3522"></label>
    <button class="go" id="save" type="button">Enregistrer</button>
    <p class="hint">Astuce : clique longuement sur ta position dans Google Maps pour copier tes coordonnées.</p>
  </section>

  <div id="content"></div>
</div>

<script>
/* ===== Réglages ===== */
const RAYON_KM = 90;
const RAFRAICHIR_SEC = 10;

/* ===== Position enregistrée ===== */
function lirePos(){
  try{
    const p = JSON.parse(localStorage.getItem("pos")||"null");
    if(p && isFinite(p.lat) && isFinite(p.lon)) return p;
  }catch(e){}
  return window.__pos || null;
}
function ecrirePos(p){
  window.__pos = p;
  try{ localStorage.setItem("pos", JSON.stringify(p)); }catch(e){}
}

const $ = id => document.getElementById(id);
const content = $("content"), statusEl = $("status");

$("cfg").onclick = () => $("settings").classList.toggle("open");
$("save").onclick = () => {
  const lat = parseFloat($("lat").value.replace(",","."));
  const lon = parseFloat($("lon").value.replace(",","."));
  if(!isFinite(lat) || !isFinite(lon) || Math.abs(lat)>90 || Math.abs(lon)>180){
    statusEl.textContent = "Coordonnées invalides"; return;
  }
  ecrirePos({lat,lon});
  $("settings").classList.remove("open");
  tick();
};

/* ===== Utilitaires ===== */
const POINTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const nomCap = d => POINTS[Math.round(d/22.5)%16];
const arrondi = n => Math.round(n).toLocaleString("fr-FR");
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371, r=Math.PI/180;
  const a=Math.sin((lat2-lat1)*r/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin((lon2-lon1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ===== Appel JSONP (contourne CORS) ===== */
function jsonpFR24(url, ms = 7000){
  return new Promise((resolve, reject) => {
    const cbName = "fr24_cb_" + Math.random().toString(36).substring(2, 9);
    const script = document.createElement("script");
    let timer = null;

    window[cbName] = (data) => {
      cleanup();
      resolve(data);
    };

    function cleanup(){
      if(timer) clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    timer = setTimeout(() => {
      cleanup();
      reject(new Error("Délai dépassé"));
    }, ms);

    script.onerror = () => {
      cleanup();
      reject(new Error("Erreur de chargement"));
    };

    const separator = url.includes("?") ? "&" : "?";
    script.src = `${url}${separator}callback=${cbName}`;
    document.head.appendChild(script);
  });
}

/* ===== Récupération des avions ===== */
async function chercherAvions(pos){
  const deg = RAYON_KM / 111.32;
  const lamin = (pos.lat - deg).toFixed(4);
  const lamax = (pos.lat + deg).toFixed(4);
  const lomin = (pos.lon - deg).toFixed(4);
  const lomax = (pos.lon + deg).toFixed(4);

  const urlFR24 = `https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${lamax},${lamin},${lomin},${lomax}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`;

  const j = await jsonpFR24(urlFR24);
  const liste = [];
  for(const key of Object.keys(j)){
    if(["full_count", "version", "stats"].includes(key)) continue;
    const d = j[key];
    if(Array.isArray(d) && typeof d[1] === "number" && typeof d[2] === "number"){
      liste.push({
        hex: d[0],
        lat: d[1],
        lon: d[2],
        track: d[3],
        alt_baro: d[4],
        gs: d[5],
        t: (d[8] || "").toUpperCase().trim(),
        r: d[9],
        origin: d[11],
        dest: d[12],
        flight: (d[16] || d[13] || "").trim()
      });
    }
  }
  return liste;
}

/* ===== Générateur de Dessins / Silhouettes Techniques ===== */
function detecterProfil(t){
  if(!t) return { type: "TWIN_JET", label: "Avion Commercial Réacteur" };
  
  // Hélicoptères
  if(/^(EC|H1|H2|R22|R44|R66|AS3|A109|A139|B06|B407|B429|S76|UH60)/.test(t)) {
    return { type: "HELICOPTER", label: "Hélicoptère" };
  }
  // Gros porteurs à 4 réacteurs
  if(/^(A388|A34|B74|C17|AN12)/.test(t)) {
    return { type: "HEAVY_QUAD", label: "Gros Porteur Quadrimoteur" };
  }
  // Turbopropulseurs / Avions régionaux
  if(/^(AT4|AT7|DH8|DH4|B350|BE20|PC12|C208|DHC6|TBM)/.test(t)) {
    return { type: "TURBOPROP", label: "Turbopropulseur Régional" };
  }
  // Jets d'affaires (réacteurs arrière)
  if(/^(C5|C25|C56|C68|C75|GLF|GLEX|CL3|CL6|FA7X|FA8X|E55P|E50P|LJ|PRM1|HA4T)/.test(t)) {
    return { type: "BIZJET", label: "Jet d'Affaires Privé" };
  }
  // Aviation légère / Monomoteurs
  if(/^(C172|C182|C152|PA28|PA38|DR40|SR20|SR22|DA40|DA42|P28A)/.test(t)) {
    return { type: "LIGHT_PROP", label: "Aviation Générale Légère" };
  }
  
  // Défaut : Bimoteur de ligne (A320, B737, A350, B777, etc.)
  return { type: "TWIN_JET", label: "Avion de Ligne Bimoteur" };
}

function genererSvgAvion(t, callsign){
  const profil = detecterProfil(t);

  // Silhouettes vectorielles précises avec vue de dessus technique
  let vectorArt = "";

  if(profil.type === "HELICOPTER"){
    vectorArt = `
      <!-- Rotor Principal -->
      <line x1="40" y1="130" x2="260" y2="130" stroke="#ffd23f" stroke-width="2.5" opacity="0.85"/>
      <circle cx="150" cy="130" r="7" fill="#ffd23f"/>
      <ellipse cx="150" cy="130" rx="100" ry="24" fill="none" stroke="#ffd23f" stroke-dasharray="4 6" opacity="0.35"/>
      <!-- Fuselage -->
      <path d="M150 75 C162 75 168 95 168 125 C168 155 158 175 154 200 L153 235 L158 240 L158 250 L142 250 L142 240 L147 235 L146 200 C142 175 132 155 132 125 C132 95 138 75 150 75 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>

      <circle cx="150" cy="245" r="3" fill="#ffd23f"/>

      <line x1="124" y1="120" x2="134" y2="120" stroke="#8fa1c2" stroke-width="2"/>

  } else if(profil.type === "HEAVY_QUAD"){
    vectorArt = `
      <!-- Ailes principales grand allongement -->
      <path d="M150 115 L285 168 L285 178 L168 162 L150 162 L132 162 L15 178 L15 168 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- 4 Réacteurs -->
      <rect x="75" y="148" width="8" height="26" rx="3" fill="#ffd23f"/>
      <rect x="105" y="140" width="8" height="26" rx="3" fill="#ffd23f"/>
      <rect x="187" y="140" width="8" height="26" rx="3" fill="#ffd23f"/>
      <rect x="217" y="148" width="8" height="26" rx="3" fill="#ffd23f"/>
      <!-- Empennage horizontal & vertical -->
      <path d="M150 220 L205 248 L205 254 L150 244 L95 254 L95 248 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Fuselage gros porteur -->
      <path d="M150 45 C164 45 168 75 168 135 L168 200 C168 230 156 256 150 262 C144 256 132 230 132 200 L132 135 C132 75 136 45 150 45 Z" fill="#1b2847" stroke="#ffd23f" stroke-width="2"/>
      <!-- Winglets -->
      <line x1="15" y1="166" x2="15" y2="182" stroke="#ffd23f" stroke-width="3"/>
      <line x1="285" y1="166" x2="285" y2="182" stroke="#ffd23f" stroke-width="3"/>
    `;
  } else if(profil.type === "BIZJET"){
    vectorArt = `
      <!-- Ailes fines flèche forte -->
      <path d="M150 120 L265 175 L260 183 L158 152 L150 152 L142 152 L40 183 L35 175 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Réacteurs montés à l'arrière du fuselage -->
      <rect x="120" y="166" width="9" height="28" rx="3" fill="#ffd23f"/>
      <rect x="171" y="166" width="9" height="28" rx="3" fill="#ffd23f"/>
      <!-- Empennage en T -->
      <path d="M150 230 L195 246 L195 252 L150 245 L105 252 L105 246 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Fuselage élancé avec nez effilé -->
      <path d="M150 50 C159 50 162 80 162 140 L162 195 C162 225 154 252 150 256 C146 252 138 225 138 195 L138 140 C138 80 141 50 150 50 Z" fill="#1b2847" stroke="#ffd23f" stroke-width="2"/>
    `;
  } else if(profil.type === "TURBOPROP"){
    vectorArt = `
      <!-- Voilure haute droite -->
      <path d="M150 115 L280 135 L280 147 L162 145 L150 145 L138 145 L20 147 L20 135 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Nacelles moteurs turbopropulseurs -->
      <rect x="88" y="118" width="12" height="34" rx="3" fill="#1e2c4c" stroke="#8fa1c2" stroke-width="1.5"/>
      <rect x="200" y="118" width="12" height="34" rx="3" fill="#1e2c4c" stroke="#8fa1c2" stroke-width="1.5"/>
      <!-- Disques d'hélices en rotation -->
      <ellipse cx="94" cy="118" rx="18" ry="4" fill="none" stroke="#ffd23f" stroke-width="2" stroke-dasharray="3 3"/>
      <ellipse cx="206" cy="118" rx="18" ry="4" fill="none" stroke="#ffd23f" stroke-width="2" stroke-dasharray="3 3"/>
      <!-- Empennage en T caractéristique (type ATR/Q400) -->
      <path d="M150 232 L200 246 L200 252 L150 246 L100 252 L100 246 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Fuselage -->
      <path d="M150 58 C161 58 163 85 163 145 L163 205 C163 235 155 255 150 258 C145 255 137 235 137 205 L137 145 C137 85 139 58 150 58 Z" fill="#1b2847" stroke="#ffd23f" stroke-width="2"/>
    `;
  } else if(profil.type === "LIGHT_PROP"){
    vectorArt = `
      <!-- Hélice frontale unique -->
      <line x1="130" y1="72" x2="170" y2="72" stroke="#ffd23f" stroke-width="3"/>
      <ellipse cx="150" cy="72" rx="20" ry="3.5" fill="none" stroke="#ffd23f" stroke-dasharray="2 3"/>
      <!-- Ailes droites monomoteur -->
      <path d="M150 115 L260 128 L260 144 L160 144 L150 144 L140 144 L40 144 L40 128 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Empennage -->
      <path d="M150 220 L188 238 L188 244 L150 238 L112 244 L112 238 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Fuselage compact -->
      <path d="M150 72 C158 72 161 95 161 140 L159 190 C159 218 154 242 150 246 C146 242 141 218 141 190 L139 140 C139 95 142 72 150 72 Z" fill="#1b2847" stroke="#ffd23f" stroke-width="2"/>
    `;
  } else {
    // Profil standard : Jet bimoteur commercial (A320 / B737...)
    vectorArt = `

      <!-- Réacteurs sous les ailes -->
      <rect x="92" y="146" width="10" height="28" rx="3.5" fill="#ffd23f"/>
      <rect x="198" y="146" width="10" height="28" rx="3.5" fill="#ffd23f"/>
      <!-- Empennage arrière -->
      <path d="M150 224 L204 249 L204 255 L150 246 L96 255 L96 249 Z" fill="#243456" stroke="#8fa1c2" stroke-width="1.8"/>
      <!-- Fuselage principal avec liseré jaune -->
      <path d="M150 48 C162 48 165 78 165 140 L165 200 C165 232 155 258 150 262 C145 258 135 232 135 200 L135 140 C135 78 138 48 150 48 Z" fill="#1b2847" stroke="#ffd23f" stroke-width="2"/>
      <!-- Sharklets aux extrémités d'ailes -->
      <line x1="25" y1="172" x2="25" y2="186" stroke="#ffd23f" stroke-width="2.5"/>

  return `
    <div class="plane-canvas">
      <div class="plane-hud-badge">${esc(t || "AIRCRAFT")}</div>
      <div class="plane-hud-type">${esc(profil.label)}</div>
      <svg class="blueprint" viewBox="0 0 300 300">
        <!-- Grille et repères HUD radar d'arrière plan -->
        <circle cx="150" cy="150" r="135" fill="none" stroke="#2c3b63" stroke-width="1" opacity="0.45"/>
        <circle cx="150" cy="150" r="90" fill="none" stroke="#2c3b63" stroke-dasharray="3 5" opacity="0.45"/>
        <line x1="150" y1="8" x2="150" y2="292" stroke="#2c3b63" stroke-dasharray="4 6" opacity="0.3"/>
        <line x1="8" y1="150" x2="292" y2="150" stroke="#2c3b63" stroke-dasharray="4 6" opacity="0.3"/>
        <g>${vectorArt}</g>
      </svg>
    </div>
  `;
}

/* ===== Affichage Général ===== */
const AVION_SVG = `<path d="M150 62 C156 62 159 72 159 86 L159 128 L222 166 L222 180 L159 160 L159 214 L182 232 L182 244 L150 236 L118 244 L118 232 L141 214 L141 160 L78 180 L78 166 L141 128 L141 86 C141 72 144 62 150 62Z" fill="#ffd23f"/>`;

function dessiner(ac, dist){
  const cap = ac.track;
  const hasCap = typeof cap === "number";
  const alt = ac.alt_baro;
  const auSol = alt === "ground" || alt === 0;
  const altM = (typeof alt === "number") ? alt*0.3048 : null;
  const vitKmh = (typeof ac.gs === "number") ? ac.gs*1.852 : null;
  const nom = (ac.flight||"").trim() || ac.r || ac.hex || "Inconnu";
  const modele = ac.t || "Modèle non renseigné";
  const immat = ac.r ? ` — ${esc(ac.r)}` : "";

  const drawingHtml = genererSvgAvion(ac.t, nom);

  const routeHtml = (ac.origin || ac.dest)
    ? `<div class="route">${esc(ac.origin || "—")} → ${esc(ac.dest || "—")}<small>Provenance → destination (codes IATA)</small></div>`
    : `<div class="route">Trajet non disponible<small>Plan de vol absent ou privé</small></div>`;

  content.innerHTML = `
  <main>
    <div class="left">
      ${drawingHtml}
      <div>
        <div class="callsign">${esc(nom)}</div>
        <div class="model">${esc(modele)}${immat}</div>
        ${routeHtml}
      </div>
    </div>
    <div class="right">
      <div class="dial" aria-label="Direction de l'avion">
        <svg viewBox="0 0 300 300">
          <circle cx="150" cy="150" r="140" fill="none" stroke="#2c3b63" stroke-width="2"/>
          <circle cx="150" cy="150" r="100" fill="none" stroke="#2c3b63" stroke-width="1" stroke-dasharray="3 6"/>
          <g fill="#8fa1c2" font-family="Barlow Condensed,sans-serif" font-size="20" text-anchor="middle">
            <text x="150" y="26">N</text><text x="283" y="157">E</text><text x="150" y="286">S</text><text x="17" y="157">O</text>
          </g>
          <g id="plane" style="transform:rotate(${hasCap?cap:0}deg)" opacity="${hasCap?1:.25}">${AVION_SVG}</g>
        </svg>
      </div>
      <div class="stats">
        <div class="stat"><div class="v">${hasCap?Math.round(cap)+"°":"—"}<i>${hasCap?nomCap(cap):""}</i></div><div class="l">Direction</div></div>
        <div class="stat"><div class="v">${auSol?"Au sol":(altM!==null?arrondi(altM):"—")}<i>${altM!==null?"m":""}</i></div><div class="l">Altitude${altM!==null?` (${arrondi(alt)} ft)`:""}</div></div>
        <div class="stat"><div class="v">${vitKmh!==null?arrondi(vitKmh):"—"}<i>km/h</i></div><div class="l">Vitesse sol</div></div>
        <div class="stat"><div class="v">${dist.toFixed(1).replace(".",",")}<i>km</i></div><div class="l">Distance de chez toi</div></div>
      </div>
    </div>
  </main>`;
}

/* ===== Boucle principale ===== */
let enCours = false;
async function tick(){
  if(enCours) return; enCours = true;
  const pos = lirePos();
  if(!pos){
    $("settings").classList.add("open");
    content.innerHTML = `<div class="empty">Entre ta latitude et ta longitude pour commencer.</div>`;
    statusEl.textContent = "Position manquante";
    enCours = false; return;
  }
  $("lat").value = pos.lat; $("lon").value = pos.lon;
  try{
    statusEl.textContent = "Recherche…";
    const liste = await chercherAvions(pos);

    if(!liste.length){
      content.innerHTML = `<div class="empty">Aucun avion détecté dans un rayon de ${RAYON_KM} km pour le moment.</div>`;
      statusEl.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
      enCours = false; return;
    }
    liste.forEach(a => a._d = distanceKm(pos.lat,pos.lon,a.lat,a.lon));
    liste.sort((a,b)=>a._d-b._d);
    const ac = liste[0];
    dessiner(ac, ac._d);
    statusEl.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
  }catch(e){
    statusEl.textContent = "Pas de connexion aux données, nouvel essai…";
    if(!document.getElementById("err")){
      content.innerHTML = '<div class="empty" id="err"></div>';
    }
    const box = document.getElementById("err");
    if(box) box.textContent = "Détail : " + e.message;
  }
  enCours = false;
}
tick();
setInterval(tick, RAFRAICHIR_SEC*1000);
</script>
</body>
</html>
